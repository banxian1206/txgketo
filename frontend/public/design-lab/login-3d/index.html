<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三维装配 · 登录体验原型</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="scene" aria-label="实时三维精密装配结构"></canvas>
<header><img src="/brand/logo-white.png" alt="同兴高科"><span>项目全生命周期管理</span><span class="prototype">交互原型 · 不连接真实账号</span></header>
<main><section class="story"><div class="eyebrow"><span></span>PRECISION IN MOTION</div><h1>每个环节，<br>精密协同。</h1><p>从一个想法，到一次完整交付。</p><div class="scene-caption"><span id="phase">01 / 分解视图</span><span>实时 WebGL 场景</span></div><div class="scene-controls"><button id="assembly" type="button">合拢装配 ↗</button><button id="motion" type="button" aria-pressed="false">暂停动态</button></div></section>
<section class="login-shell"><div class="login-top"><span class="line"></span><span>TXGK / WORKSPACE</span></div><h2>欢迎回来</h2><p class="intro">登录，开始今天的工作。</p><form id="login" novalidate><label for="account">账号</label><div class="field"><span aria-hidden="true">◎</span><input id="account" name="account" autocomplete="off" placeholder="输入演示账号" spellcheck="false"></div><label for="password">密码</label><div class="field"><span aria-hidden="true">◇</span><input id="password" name="password" type="password" autocomplete="new-password" placeholder="输入演示密码"><button id="eye" type="button" aria-label="显示密码">显示</button></div><p id="feedback" role="status" aria-live="polite"></p><button id="submit" class="primary" type="submit"><span>登录工作台</span><span aria-hidden="true">→</span></button></form><div class="demo-note">无需真实账号：填写任意演示内容即可。<br>密码填 <button id="fail-demo" type="button">error</button> 可体验失败反馈。</div><div class="form-footer"><span class="dot"></span>企业内部工作空间</div></section></main>
<footer><span>同兴高科 · TXAM</span><span>移动鼠标探索空间 · 登录时零件合拢</span><span>DESIGN EXPLORATION / 01</span></footer>
<section id="success" hidden role="dialog" aria-modal="true" aria-label="模拟登录成功" aria-live="polite"><div><span class="success-mark">✓</span><p class="eyebrow">ASSEMBLY COMPLETE</p><h2>协同，准备就绪。</h2><p>登录成功动效演示，未进行真实认证。</p><button id="restart" type="button">再次体验 ↗</button></div></section>
<script src="scene.js"></script></body></html>
