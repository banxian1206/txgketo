<label>预计到场时间<input type="datetime-local"></label></div>','<button class="primary" onclick="toast(\'样机：叫车反馈已演示\');closeModal()">确认已叫车</button>');else if(a==='price')show('采购单价格退回 · PO26008','<div class="notice">采购经理退回：8M–30 比上次贵 12%，请补充报价依据。</div><div class="fields"><label>本次单价<input value="56"></label><label>上次单价<input value="50" readonly></label></div><label>价格说明<textarea placeholder="补充本次报价变化依据"></textarea></label>','<button class="primary" onclick="toast(\'样机：已演示重新提交审批\');closeModal()">重新提交</button>');else if(a==='feedback')show('反馈物料问题','<div class="notice">入库后发现的问题，同样需要关联物料与采购单。</div><div class="fields"><label>关联采购单<input placeholder="搜索采购单号"></label><label>物料<input placeholder="搜索物料编号或名称"></label></div><textarea placeholder="描述发现的问题"></textarea>','<button class="primary" onclick="toast(\'样机：反馈入口已演示\');closeModal()">提交反馈</button>');else show('采购单记录','<p>PO26013 · 华南机电设备有限公司</p><p>3 种物料 · 涉及 TX26005、TX26007 · 待经理审批</p><div class="notice">需求 → 采购单 → 两级价格审批 → 在途 → 验收 → 入库</div>')}
