<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台角色化方案 · 效果图</title>
  <style>
    :root{--blue:#1f5fd0;--ink:#172033;--muted:#68758c;--line:#e7ebf2;--paper:#fff;--bg:#f5f7fb;--soft:#edf4ff;--danger:#d94242;--warn:#b96a00;--ok:#14804a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;letter-spacing:.01em}.top{height:64px;padding:0 42px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:26px;position:sticky;top:0;z-index:5}.brand{font-weight:780;font-size:19px;letter-spacing:.02em}.brand small{font-size:11px;color:var(--muted);font-weight:650;margin-left:8px}.workspace{color:var(--muted);border-left:1px solid var(--line);padding-left:25px}.search{margin-left:auto;width:330px;border:1px solid var(--line);border-radius:9px;padding:10px 13px;color:#8a95a9;background:#fbfcfe}.search b{float:right;font-size:11px;border:1px solid #dfe5ee;border-radius:4px;padding:1px 5px;color:#7d8798}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e7efff;color:var(--blue);font-weight:800}.shell{max-width:1380px;margin:0 auto;padding:32px 42px 48px}.eyebrow{display:flex;align-items:center;justify-content:space-between}.eyebrow p{color:var(--muted);margin:8px 0 0;font-size:14px}.eyebrow h1{font-size:28px;margin:0;letter-spacing:-.03em}.role-switch{display:flex;gap:4px;padding:4px;background:#eaf0f9;border-radius:10px}.role-switch button{cursor:pointer;border:0;background:transparent;padding:8px 14px;border-radius:7px;color:#58667d;font-weight:650}.role-switch button.active{background:white;color:var(--blue);box-shadow:0 1px 4px #c9d3e344}.focus{margin-top:24px;border:1px solid #dce7fb;background:linear-gradient(100deg,#fff 0%,#f1f6ff 100%);border-radius:14px;padding:17px 19px;display:flex;align-items:center;gap:16px}.focus i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#dceaff;color:var(--blue);font-style:normal;font-weight:800}.focus strong{font-size:15px}.focus span{color:var(--muted);margin-left:8px}.focus a{margin-left:auto;background:var(--blue);color:white;border-radius:8px;padding:9px 13px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-height:91px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:25px;font-weight:780;margin-top:7px;letter-spacing:-.04em}.metric .note{font-size:12px;margin-top:3px;color:var(--muted)}.metric.red .value,.red{color:var(--danger)}.metric.warn .value,.warn{color:var(--warn)}.metric.ok .value,.ok{color:var(--ok)}.tabs{display:flex;gap:26px;height:57px;align-items:end;border-bottom:1px solid var(--line);margin-top:24px}.tab{padding:0 2px 15px;color:var(--muted);font-weight:650}.tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}.tab b{margin-left:5px;background:#edf1f7;color:#657187;border-radius:10px;padding:2px 6px;font-size:11px}.content{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;margin-top:16px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{padding:18px 19px 14px;display:flex;align-items:center;gap:10px}.panel-head h2{font-size:16px;margin:0}.panel-head p{margin:0;color:var(--muted);font-size:12px}.panel-head .hint{margin-left:auto;color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-weight:550;color:#7b8798;font-size:12px;background:#fbfcfe;padding:11px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:14px 18px;border-bottom:1px solid #edf0f5;vertical-align:middle}.table tr:last-child td{border-bottom:0}.project strong{display:block;font-size:14px}.project span{font-size:12px;color:var(--muted);display:block;margin-top:3px}.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#2f7de1}.dot.warn{background:#e7a018}.dot.red{background:#df5959}.progress{height:5px;width:74px;border-radius:5px;background:#e9edf4;overflow:hidden}.progress i{display:block;background:#4b82dd;height:100%;border-radius:5px}.next strong{font-weight:680;font-size:13px;display:block}.next span{font-size:12px;color:var(--muted);display:block;margin-top:3px}.action{color:var(--blue);font-weight:700;font-size:13px;white-space:nowrap}.side .panel{margin-bottom:16px}.side-row{padding:13px 17px;border-top:1px solid #edf0f5;display:flex;gap:10px}.side-row:first-of-type{border-top:0}.badge{min-width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#fff2ee;color:#cd4737;font-weight:800}.side-row strong{font-size:13px}.side-row p{color:var(--muted);font-size:12px;margin:4px 0 0;line-height:1.45}.insight{padding:15px 17px;border-top:1px solid #edf0f5}.insight:first-of-type{border-top:0}.insight .k{font-size:12px;color:var(--muted)}.insight b{font-size:18px;display:block;margin-top:5px}.footnote{margin-top:17px;color:#7d8899;font-size:12px;text-align:center}@media(max-width:850px){.top{padding:0 18px}.workspace,.search{display:none}.shell{padding:24px 16px}.eyebrow{display:block}.role-switch{margin-top:16px;width:max-content}.metrics{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.table th:nth-child(3),.table td:nth-child(3),.table th:nth-child(6),.table td:nth-child(6){display:none}.focus{align-items:flex-start}.focus a{display:none}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">同兴高科 <small>TXGK · 项目全生命周期</small></div><div class="workspace">工作台</div><div class="search">⌕　搜编号、图号、物料、项目 <b>⌘ K</b></div><span>消息</span><div class="avatar">李</div></header>
  <main class="shell">
    <section class="eyebrow"><div><h1 id="title">商务工作台</h1><p id="subtitle">销售执行 · 只显示需要我跟进的项目与回款</p></div><div class="role-switch"><button class="active" data-role="staff">销售员</button><button data-role="manager">销售经理</button><button data-role="director">销售总监</button></div></section>
    <section class="focus"><i>!</i><div><strong id="focus-title">今天优先处理 2 件事</strong><span id="focus-copy">1 笔回款今天到期；1 个商机将在 3 天后截止</span></div><a id="focus-action">查看待办</a></section>
    <section class="metrics" id="metrics"></section>
    <nav class="tabs"><div class="tab active" id="tab-a">我的项目 <b id="tab-count">8</b></div><div class="tab" id="tab-b">回款跟进 <b id="payment-count">2</b></div><div class="tab" id="tab-c">已关闭 / 已成交</div></nav>
    <section class="content"><article class="panel"><div class="panel-head"><div><h2 id="list-title">我负责的项目</h2><p id="list-copy">一行看清现在处在哪、接下来谁该做什么</p></div><span class="hint">按风险与到期时间排序</span></div><table class="table"><thead><tr><th>项目 / 客户</th><th>当前阶段</th><th>项目进展</th><th>下一步与期限</th><th>回款</th><th>风险</th><th></th></tr></thead><tbody id="rows"></tbody></table></article><aside class="side"><article class="panel"><div class="panel-head"><div><h2 id="side-title">今天要跟进</h2><p>只保留需要动手的事项</p></div></div><div id="todos"></div></article><article class="panel"><div class="panel-head"><div><h2 id="insight-title">本周概况</h2><p id="insight-copy">个人管道与回款</p></div></div><div id="insights"></div></article></aside></section>
    <p class="footnote">方案效果图：同一个页面骨架，只根据角色替换“关注范围、结论和主队列”，而不是另做三套页面。</p>
  </main>
  <script>
    const sets={
      staff:{title:'商务工作台',sub:'销售执行 · 只显示需要我跟进的项目与回款',focus:['今天优先处理 2 件事','1 笔回款今天到期；1 个商机将在 3 天后截止'],metrics:[['今日待跟进','2','1 笔回款 · 1 个商机','red'],['本月可收款','¥ 380,000','2 个付款节点','warn'],['我的商机','8','其中 3 个线索推进中',''],['成交待立项','1','立项团队待完善','warn'],['项目异常','1','设计发布晚于计划','red']],list:['我负责的项目','一行看清现在处在哪、接下来谁该做什么'],rows:[['TX26012','华南智造有限公司','商机推进','意向确认','45','确认报价有效期','10/09','—','跟进超期'],['TX26010','佛山自动化产线','成交待立项','立项准备','12','补充付款计划','今天','¥ 210,000','回款到期'],['TX26005','E2E回归客户','执行中','工程设计','38','跟进设计发布','10/12','¥ 500,000','需留意'],['TX26001','智造装备有限公司','质保期','售后跟进','92','查看未关工单','—','—','正常']],todos:[['1','确认 TX26010 的 ¥210,000 回款','付款节点今天到期'],['2','联系 TX26012 客户确认报价','商机截止还有 3 天']],insights:[['本周预计成交','¥ 1,200,000'],['本周已回款','¥ 380,000']]},
      manager:{title:'商务工作台',sub:'销售经理 · 先处理团队异常，再看每个销售的管道',focus:['团队有 3 件事需要协调','2 笔回款逾期；1 个成交项目尚未完成起项资料'],metrics:[['团队待协调','3','回款、立项、跟进超期','red'],['本月可收款','¥ 1,480,000','6 个付款节点','warn'],['团队商机','26','8 个重点推进中',''],['成交待立项','3','需补齐立项信息','warn'],['高风险项目','2','已进入升级关注','red']],list:['团队重点项目','默认只列异常、临期和需要经理协调的项目'],rows:[['TX26010','佛山自动化产线 · 陈明','成交待立项','立项准备','12','协调立项资料','今天','¥ 210,000','回款到期'],['TX26012','华南智造 · 李晨','商机推进','意向确认','45','协助报价决策','10/09','—','跟进超期'],['TX26018','精密装备 · 王宁','执行中','采购到货','57','确认客户变更影响','10/11','¥ 360,000','需协调'],['TX26005','E2E回归客户 · 李晨','执行中','工程设计','38','跟进设计发布','10/12','¥ 500,000','需留意']],todos:[['1','处理 2 笔逾期回款','销售已催收，需要经理介入'],['2','确认 TX26010 立项资料责任人','成交后尚缺付款计划'],['3','审核重点商机报价策略','TX26012 · 截止前 3 天']],insights:[['本月成交目标','72%'],['团队回款完成','¥ 2,480,000']]},
      director:{title:'商务工作台',sub:'商务总监 · 用例外和趋势做决策，不陷入逐条跟进',focus:['本周需决策 2 项','一项重点报价偏离目标；一笔大额回款需要升级沟通'],metrics:[['需决策事项','2','报价与重点回款','red'],['本月签约','¥ 4,860,000','完成目标 68%',''],['本月回款','¥ 2,480,000','完成目标 54%','warn'],['重点商机','6','合同额 ≥ 100 万',''],['经营风险','2','回款与项目交期','red']],list:['需要关注的经营例外','显示金额、趋势、责任人与下一次决策时间'],rows:[['TX26012','华南智造 · 重点商机','商机推进','意向确认','45','决定报价边界','10/09','—','报价风险'],['TX26010','佛山自动化产线','成交待立项','立项准备','12','升级大额回款','今天','¥ 210,000','回款到期'],['TX26018','精密装备项目','执行中','采购到货','57','确认变更商业影响','10/11','¥ 360,000','范围风险'],['TX26005','E2E回归客户','执行中','工程设计','38','仅跟踪，无需介入','—','¥ 500,000','正常']],todos:[['1','确定 TX26012 报价底线','项目额 ¥1,200,000 · 今日评审'],['2','决定 TX26010 回款升级方案','逾期 7 天 · 责任销售陈明']],insights:[['本月合同目标','¥ 7,200,000'],['回款风险敞口','¥ 860,000']]}
    };
    const metric=(m)=>`<div class="metric ${m[3]||''}"><div class="label">${m[0]}</div><div class="value">${m[1]}</div><div class="note">${m[2]}</div></div>`;
    const status=(v)=>v==='回款到期'||v==='跟进超期'||v==='报价风险'?'<span class="pill red"><i class="dot red"></i>'+v+'</span>':v==='需协调'||v==='需留意'||v==='范围风险'?'<span class="pill warn"><i class="dot warn"></i>'+v+'</span>':'<span class="pill ok"><i class="dot" style="background:#24a368"></i>'+v+'</span>';
    function render(role){const d=sets[role];document.getElementById('title').textContent=d.title;document.getElementById('subtitle').textContent=d.sub;document.getElementById('focus-title').textContent=d.focus[0];document.getElementById('focus-copy').textContent=d.focus[1];document.getElementById('metrics').innerHTML=d.metrics.map(metric).join('');document.getElementById('list-title').textContent=d.list[0];document.getElementById('list-copy').textContent=d.list[1];document.getElementById('tab-count').textContent=role==='staff'?'8':role==='manager'?'26':'6';document.getElementById('payment-count').textContent=role==='staff'?'2':role==='manager'?'6':'4';document.getElementById('rows').innerHTML=d.rows.map(r=>`<tr><td class="project"><strong>${r[0]} · ${r[1]}</strong><span>责任范围内项目</span></td><td><span class="pill"><i class="dot"></i>${r[2]}</span></td><td><span>${r[3]}</span><div class="progress"><i style="width:${r[4]}%"></i></div></td><td class="next"><strong>${r[5]}</strong><span>${r[6]}</span></td><td>${r[7]}</td><td>${status(r[8])}</td><td class="action">查看 →</td></tr>`).join('');document.getElementById('side-title').textContent=role==='staff'?'今天要跟进':role==='manager'?'需要协调':'待决事项';document.getElementById('insight-title').textContent=role==='staff'?'本周概况':role==='manager'?'团队概况':'经营信号';document.getElementById('insight-copy').textContent=role==='staff'?'个人管道与回款':role==='manager'?'团队管道与回款':'用于决策的少量关键数';document.getElementById('todos').innerHTML=d.todos.map(x=>`<div class="side-row"><span class="badge">${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('');document.getElementById('insights').innerHTML=d.insights.map(x=>`<div class="insight"><span class="k">${x[0]}</span><b>${x[1]}</b></div>`).join('');document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));}
    document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.role)));render('staff');
  </script>
</body>
</html>
