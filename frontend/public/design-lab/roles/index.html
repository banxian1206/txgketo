let current='sales', section=0;
const $=s=>document.querySelector(s);
function detail(item){
 $('#dialog-title').textContent=item.title;
 const body=$('.dialogbody');body.replaceChildren();
 const p=document.createElement('p');p.textContent=item.why;body.append(p);
 const h=document.createElement('h3');h.textContent='工作页与交接内容';body.append(h);
 const ul=document.createElement('ul');item.details.forEach(d=>{const li=document.createElement('li');li.textContent=d;ul.append(li)});body.append(ul);
 const note=document.createElement('p');note.className='note';note.textContent='方案示意：不连接API，不提交业务操作；待实现与未决规则已在内容中标明。';body.append(note);
 $('dialog').showModal();
}
function render(){
 const p=profiles[current];
 $('.roles').innerHTML=Object.entries(profiles).map(([k,v])=>'<button data-role="'+k+'" aria-pressed="'+(k===current)+'">'+v.name+'</button>').join('');
 $('.identity').innerHTML='<strong>'+p.identity+'</strong><small>当前示意：'+p.name+'的工作范围</small>';
 $('nav').innerHTML=p.pages.map((page,i)=>'<button data-nav="'+i+'" aria-current="'+(section===i?'page':'false')+'">'+page.label+'</button>').join('');
 $('.navhelp').textContent='当前为方案对照，角色切换不代表正式系统身份切换。';
 $('#breadcrumb').textContent=p.pages[section].label;$('#eyebrow').textContent=p.identity;$('#title').textContent=p.title;$('#intro').textContent=p.intro;
 $('.scope').innerHTML='<b>'+p.name+'</b><span>'+p.scope+'</span>';
 $('#list-title').textContent=p.pages[section].label;$('#list-note').textContent='示意事项 · 非实时业务数量';
 $('#context-title').textContent=p.contextTitle;$('#context').textContent=p.context;$('#receiver').textContent=p.receiver;
 $('.chain').innerHTML=Object.entries(profiles).map(([key,v],i)=>'<button class="secondary" data-flow="'+key+'" aria-pressed="'+(key===current)+'">'+v.name+'</button>'+(i<5?' → ':'')).join('');
 $('.designnotes').textContent=p.notes;
 const shown=p.pages[section].items;
 $('#items').innerHTML=shown.map((it,i)=>'<article class="item"><div class="itemtop"><h3>'+it.title+'</h3><span class="tag">'+it.state+'</span></div><p class="reference">'+it.ref+'</p><p class="why">'+it.why+'</p><div class="actionline"><small>'+it.next+'</small><button class="primary" data-item="'+i+'">'+it.action+'</button></div></article>').join('');
 document.querySelectorAll('[data-role],[data-flow]').forEach(b=>b.onclick=()=>{current=b.dataset.role||b.dataset.flow;section=0;render()});
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=Number(b.dataset.nav);render()});
 document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>detail(shown[Number(b.dataset.item)]));
}
$('#notes-toggle').onclick=()=>{const n=$('.designnotes');n.hidden=!n.hidden;$('#notes-toggle').setAttribute('aria-expanded',String(!n.hidden));$('#notes-toggle').textContent=n.hidden?'查看设计说明':'收起设计说明'};
$('#close-dialog').onclick=()=>$('dialog').close();render();
</script></body></html>
